<section class="categories">
  @for (category of categories(); track category.title) {
    <div class="category">
      <img
        class="category-thumbnail"
        [class]="category.link"
        [src]="category.thumbnailUrl"
        [alt]="category.title + ' category thumbnail'"
      />
      <h2 class="category-title">{{ category.title }}</h2>
      <a [routerLink]="category.link" class="category-link"
        >SHOP <img src="images/shared/desktop/icon-arrow-right.svg" alt="" aria-hidden="true"
      /></a>
    </div>
  }
</section>

<section class="featured-products">
  <article class="feature-card zx9">
    <picture>
      <source srcset="images/home/desktop/image-speaker-zx9.png" media="(min-width: 1440px)" />
      <source srcset="images/home/tablet/image-speaker-zx9.png" media="(min-width: 768px)" />
      <img
        class="zx9-icon"
        src="images/home/mobile/image-speaker-zx9.png"
        alt="Thumbnail of ZX9 speaker"
      />
    </picture>

    <h2>
      ZX9 <br />
      SPEAKER
    </h2>

    <p>
      Upgrade to premium speakers that are phenomenally built to deliver truly remarkable sound.
    </p>

    <a routerLink="" class="btn btn-dark">SEE PRODUCT</a>
  </article>
</section>
